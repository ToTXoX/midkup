<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#fff9e9"/>
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png"/>
  <link rel="stylesheet" href="/src/garden-loading.css"/>
  <link rel="preload" href="/assets/game/manifest.json" as="fetch" crossorigin/>
  <link rel="preload" href="/assets/game/characters/mudkip/mudkip.glb" as="fetch" crossorigin/>
  <link rel="preload" href="/assets/game/environments/garden.glb" as="fetch" crossorigin/>
  <link rel="preload" href="/assets/game/fx/textures/cartoon-splash-v14.png" as="image" crossorigin fetchpriority="low"/>
  <title>ZUZU · 庭院日和</title>
</head>
<body data-pack="game" class="resource">
<section id="garden-loading" class="garden-loading" aria-labelledby="garden-load-title">
  <div class="garden-loading-card">
    <div class="garden-loading-avatar" aria-hidden="true"><img src="/assets/ui/mudkip-avatar-user-v1.png" alt="" draggable="false" width="68" height="68"/></div>
    <p class="garden-loading-series">ZUZU · GARDEN DAYS</p>
    <h2 id="garden-load-title">ZUZU 的庭院</h2>
    <div class="garden-loading-caption">
      <span>正在准备庭院…</span>
      <span id="garden-load-percent" aria-hidden="true">0%</span>
    </div>
    <progress id="garden-load-progress" max="8" value="0" aria-label="庭院资源加载进度"></progress>
  </div>
</section>
<main id="app" inert>
  <svg class="ui-symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>

        <path d="M30 7Q34 16 32 26" fill="none" stroke="#509dbf" stroke-width="1.1"/>
        <path d="M12 41C12 30 20 23 32 23C44 23 52 30 52 41C52 53 44 60 32 60C20 60 12 53 12 41Z" fill="#79c9e6"/>
        <path d="M18 52Q32 57 46 52C42 58 37 60 32 60C26 60 21 57 18 52Z" fill="#eaf7f2" stroke="none"/>
        <path d="M16 36Q12 35 7 31L8 39L3 43L9 46L8 53Q14 51 18 47Q20 42 16 36Z" fill="#f4b366"/>
        <path d="M48 36Q52 35 57 31L56 39L61 43L55 46L56 53Q50 51 46 47Q44 42 48 36Z" fill="#f4b366"/>
        <path d="M11 40L16 42M53 40L48 42" fill="none" stroke="#d48d4d" stroke-width="1"/>
      </g>
      <ellipse cx="24" cy="40" rx="2.35" ry="3.8" fill="#294d64"/><ellipse cx="40" cy="40" rx="2.35" ry="3.8" fill="#294d64"/>
      <ellipse cx="23.5" cy="38.6" rx=".85" ry="1.2" fill="#fffef6"/><ellipse cx="39.5" cy="38.6" rx=".85" ry="1.2" fill="#fffef6"/>
      <path d="M28 48Q32 50.5 36 48" fill="none" stroke="#3e687f" stroke-width="1.3" stroke-linecap="round"/>
    </symbol>
    <symbol id="ui-star" viewBox="0 0 24 24"><path d="m12 2 2.8 6.2 6.7.8-5 4.6 1.4 6.7-5.9-3.4-5.9 3.4 1.4-6.7-5-4.6 6.7-.8Z" fill="currentColor" stroke="#476477" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="ui-dance-note" viewBox="0 0 24 24"><path d="M9 17V4c3 0 3 3 7 3v4c-4 0-4-3-7-3" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><ellipse cx="6" cy="17.5" rx="4" ry="3" fill="currentColor"/><path d="M19 13v6m-3-3h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="ui-walk" viewBox="0 0 24 24"><g fill="currentColor"><ellipse cx="8" cy="15" rx="3" ry="4" transform="rotate(-20 8 15)"/><ellipse cx="16" cy="9" rx="3" ry="4" transform="rotate(20 16 9)"/><circle cx="6" cy="8" r="1.5"/><circle cx="18" cy="3" r="1.5"/></g></symbol>
    <symbol id="ui-run" viewBox="0 0 24 24"><path d="m8 6 5 2 2 5 5 2m-7-7-4 6-5 2m7-3 3 7M3 5h4M1 9h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="4" r="2" fill="currentColor"/></symbol>
    <symbol id="ui-reset" viewBox="0 0 24 24"><path d="M5 7a8 8 0 1 1-1 9M4 3v6h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ui-home" viewBox="0 0 24 24"><path d="M5 11v9h14v-9" fill="#fff6dd" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m2 11 10-8 10 8" fill="#efbd75" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 20v-6h4v6" fill="#8dcfdf" stroke="currentColor" stroke-width="1.4"/></symbol>
    <symbol id="ui-pause" viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="2" fill="#f0ca80" stroke="currentColor" stroke-width="1.5"/><rect x="14" y="4" width="5" height="16" rx="2" fill="#f0ca80" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="ui-play" viewBox="0 0 24 24"><path d="M7 4q-1-1-1 1v14q0 2 2 1l13-7q1-1-1-2Z" fill="#82c8da" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="ui-camera" viewBox="0 0 24 24"><path d="m8 5 1-2h6l1 2h4q2 0 2 2v12H2V7q0-2 2-2Z" fill="#a4d5df" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="4.3" fill="#fffbed" stroke="currentColor" stroke-width="1.6"/><circle cx="18.5" cy="8" r="1" fill="#f0ba71"/></symbol>
    <symbol id="ui-stage" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3" fill="#fff4dd" stroke="currentColor" stroke-width="1.6"/><path d="M3 8h18M7 4l3 4M14 4l3 4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m10 11 6 3-6 3Z" fill="#80c4d7" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></symbol>
  </defs></svg>
  <div id="scene" aria-label="ZUZU 游戏资源三维预览"></div>
  <header><span class="brand-mark" aria-hidden="true"><img src="./assets/ui/mudkip-avatar-user-v1.png" alt="" draggable="false" width="66" height="66"/></span><div><span class="eyebrow">ZUZU · GARDEN DAYS</span><h1><span class="title-full">ZUZU 的庭院</span><span class="title-short">ZUZU 庭院</span><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#ui-star"/></svg></h1><span class="brand-kana" aria-hidden="true">きょうも、いっしょに。</span></div></header>
  <aside id="garden-score" class="practice-score" aria-label="练习命中次数" hidden><svg class="score-star" aria-hidden="true" viewBox="0 0 24 24"><use href="#ui-star"/></svg><div><span>技能练习 <small>HIT!</small></span><strong id="garden-hit-count">00</strong></div><button id="garden-clear-hits" aria-label="清空命中" title="清空命中"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#ui-reset"/></svg></button></aside>
  <button id="garden-music" class="garden-music-toggle" type="button" aria-label="背景音乐" aria-pressed="false" hidden>
    <svg aria-hidden="true" viewBox="0 0 24 24">
      <path d="M9 18V6l10-2v11M9 10l10-2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <ellipse cx="6" cy="18" rx="3.5" ry="2.5" fill="currentColor"/>
      <ellipse cx="16" cy="15" rx="3.5" ry="2.5" fill="currentColor"/>
      <g class="music-off-mark" fill="none" stroke-linecap="round">
        <path d="M4 4l16 16" stroke="var(--ui-paper)" stroke-width="4"/>
        <path d="M4 4l16 16" stroke="currentColor" stroke-width="1.6"/>
      </g>
    </svg>
  </button>
  <audio id="garden-bgm" src="/assets/audio/peaceful-ville.mp3" preload="none" loop></audio>
  <div class="view-hint"><span id="view-hint">拖动旋转 · 滚轮缩放</span><button id="enter-garden" class="garden-entry" disabled>去庭院散步 →</button></div>
  <section class="controls" aria-label="动画控制">
    <div class="panel-heading"><span class="dot"></span><span id="clip-label" aria-live="polite">正在整理小伙伴…</span><span id="duration">—</span></div>
    <h2 id="resource-title">和 ZUZU 玩一会儿</h2>
    <p class="intro" id="resource-hint" aria-live="polite">十二段动作 · 可以逐帧查看。</p>
    <div class="stage-selectors">
      <div class="scene-choice"><label for="scene-view">场景</label><select id="scene-view" disabled><option value="stage">动作台</option><option value="garden">庭院漫游</option></select></div>
      <div class="scene-choice character-choice" role="group" aria-labelledby="character-roster-label">
        <span id="character-roster-label">角色池</span>
        <div id="character-roster" class="character-roster"></div>
      </div>
    </div>
    <div class="actions" role="group" aria-label="选择动作">
      <button data-clip="Idle" aria-pressed="true" disabled><span>待机</span><small>轻轻呼吸</small></button>
      <button data-clip="Walk" aria-pressed="false" disabled><span>走路</span><small>轻快小步</small></button>
      <button data-clip="Run" aria-pressed="false" disabled><span>小跑</span><small>蹬地轻跳</small></button>
      <button data-clip="PetReaction" aria-pressed="false" disabled><span>摸头</span><small>开心摇尾</small></button>
      <button data-clip="Eat" aria-pressed="false" disabled><span>进食</span><small>低头咀嚼</small></button>
      <button data-clip="WaterCharge" aria-pressed="false" disabled><span>蓄力</span><small>稳住身体</small></button>
      <button data-clip="WaterShoot" aria-pressed="false" disabled><span>喷水</span><small>张嘴发射</small></button>
      <button data-clip="Swim" aria-pressed="false" disabled><span>游泳</span><small>划水摆尾</small></button>
      <button data-clip="SwimIdle" aria-pressed="false" disabled><span>漂浮</span><small>轻轻踩水</small></button>
      <button data-clip="DanceA" aria-pressed="false" disabled><span>跳舞</span><small>摇摇踏踏</small></button>
      <button data-clip="DanceB" aria-pressed="false" disabled><span>尾巴舞</span><small>扭扭尾巴</small></button>
      <button data-clip="DanceC" aria-pressed="false" disabled><span>庆祝舞</span><small>转圈眯眼</small></button>
      <button data-clip="Wave" aria-pressed="false" hidden disabled><span>挥手</span><small>打个招呼</small></button>
      <button data-clip="Basketball" aria-pressed="false" hidden disabled><span>篮球</span><small>运球转身投篮</small></button>
      <button data-clip="Jump" aria-pressed="false" hidden disabled><span>跳</span><small>空中展翅</small></button>
      <button data-clip="Rap" aria-pressed="false" hidden disabled><span>RAP</span><small>墨镜踩拍</small></button>
    </div>
    <div class="setting"><label for="rate">走路 / 小跑步频</label><output id="rate-value" for="rate">1.0×</output></div>
    <input id="rate" type="range" min="0.5" max="1.8" step="0.1" value="1" aria-label="走路步频" disabled/>
    <label class="movement"><span><strong>点击地面移动</strong><small>动作台中测试位移</small></span><input id="movement" type="checkbox" role="switch" disabled/><span class="switch" aria-hidden="true"></span></label>
    <div class="timeline"><input id="timeline" type="range" min="0" max="1000" step="1" value="0" aria-label="动画进度，拖动后暂停" disabled/><output id="time">0.00 / 3.00 s</output></div>
    <div class="secondary"><button id="pause" disabled>暂停</button><span class="divider"></span><button id="reset-view">重置视角</button><span id="playback-note">循环播放</span></div>
  </section>
  <div id="aim-reticle" class="aim-reticle" aria-hidden="true" hidden><i></i><i></i><i></i><i></i><b></b><span id="aim-label"></span></div>
  <div id="hit-pop" class="hit-pop" aria-hidden="true" hidden><span>ナイス！</span><strong>命中 +1</strong><svg viewBox="0 0 24 24"><use href="#ui-star"/></svg></div>
  <div id="garden-dance-effects" class="garden-dance-effects" aria-hidden="true" hidden>
    <svg class="dance-note-left" viewBox="0 0 24 24"><use href="#ui-dance-note"/></svg>
    <svg class="dance-star" viewBox="0 0 24 24"><use href="#ui-star"/></svg>
    <svg class="dance-note-right" viewBox="0 0 24 24"><use href="#ui-dance-note"/></svg>
  </div>
  <div class="target-hotspots" aria-label="选择练习靶"><button data-aim-target="normal" aria-label="瞄准普通靶" hidden><span>普通靶</span></button><button data-aim-target="moving" aria-label="瞄准滑轨靶" hidden><span>滑轨靶</span></button><button data-aim-target="heavy" aria-label="瞄准重型靶" hidden><span>重型靶</span></button></div>
  <div class="target-hotspots"><button id="garden-basket" aria-label="去果篮吃果子" hidden></button></div>
  <nav id="garden-menu" class="garden-menu" aria-label="庭院工具菜单" hidden>
    <button id="garden-menu-toggle" class="garden-menu-toggle" aria-label="展开菜单" aria-expanded="false" aria-controls="garden-menu-panel" title="展开菜单"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>菜单</span></button>
    <button id="garden-recenter" class="garden-recenter" type="button" aria-label="恢复全景"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-camera"/></svg><span>全景</span></button>
    <div id="garden-friends">
      <button id="garden-invite" class="garden-invite-toggle" type="button" aria-label="邀请朋友" title="邀请朋友" aria-expanded="false" aria-controls="garden-invite-panel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="7" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2m4-12v8m-4-4h8"/></svg>
        <span>邀请</span>
      </button>
      <section id="garden-invite-panel" class="garden-invite-panel" aria-labelledby="garden-invite-heading" hidden>
        <h2 id="garden-invite-heading">邀请朋友</h2>
        <ul id="garden-invite-list" class="garden-invite-list"></ul>
        <p id="garden-invite-status" class="garden-invite-status" role="status"></p>
      </section>
    </div>
    <div id="garden-menu-panel" class="garden-buttons garden-menu-panel" hidden><button id="garden-reset" aria-label="回到起点" title="回到起点"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#ui-home"/></svg><span>起点</span></button><button id="garden-pause" aria-label="暂停" title="暂停" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24"><use id="garden-pause-icon" href="#ui-pause"/></svg><span id="garden-pause-caption">暂停</span></button><button id="garden-camera" aria-label="重置视角" title="重置视角"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#ui-camera"/></svg><span>视角</span></button><button id="garden-back" aria-label="返回动作台" title="返回动作台"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#ui-stage"/></svg><span>动作台</span></button></div>
  </nav>
  <div id="garden-dock" class="garden-dock" hidden>
    <div id="garden-skill" class="water-skill">
      <div class="garden-skill-actions" role="group" aria-label="角色技能">
        <button id="garden-dance" class="skill-button dance-button" type="button" aria-busy="false">
          <span class="skill-thumb"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-dance-note"/></svg><strong>跳舞</strong></span>
        </button>
        <button id="garden-mud" class="skill-button mud-button" aria-label="掷泥" title="掷泥" disabled>
          <span class="skill-thumb"><svg viewBox="0 0 32 28" aria-hidden="true"><path d="M6 17c0-4 4-6 7-5 1-5 8-5 10-1 5 0 7 4 5 8-1 3-4 4-8 4H12c-4 0-7-2-6-6Z" fill="currentColor"/><path d="m5 11-2-2m10-4V3m12 3 2-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M11 17c2-2 5-3 8-2" fill="none" stroke="#a06a47" stroke-width="1.7" stroke-linecap="round"/></svg><strong>掷泥</strong></span>
        </button>
        <button id="garden-tackle" class="skill-button tackle-button" aria-label="撞击" title="撞击" disabled>
          <span class="skill-thumb"><svg viewBox="0 0 32 28" aria-hidden="true"><path d="M17 3l3 7 9-2-6 7 4 7-8-2-5 6-1-8-7-2 7-4z" fill="currentColor"/><path d="M8 6H3m7 15H3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><strong>撞击</strong></span>
        </button>
        <div id="garden-water-slot" class="garden-water-slot">
          <button id="garden-fire" class="skill-button" aria-label="喷水" aria-describedby="skill-caption" disabled>
            <svg class="skill-spark" viewBox="0 0 24 24" aria-hidden="true"><use href="#ui-star"/></svg>
            <span id="skill-thumb" class="skill-thumb"><svg viewBox="0 0 40 44" aria-hidden="true"><path d="M20 3C17 10 7 19 7 27a13 13 0 0 0 26 0C33 19 23 10 20 3Z" fill="currentColor"/><path d="M12 27c0 5 3 8 8 8" fill="none" stroke="#5fa5b5" stroke-width="3" stroke-linecap="round"/></svg><strong id="skill-title">水枪</strong></span>
          </button>
          <div id="skill-stick" class="skill-stick" aria-hidden="true" hidden></div>
          <span id="skill-caption">点按喷水 · 拖动瞄准</span>
        </div>
        <button id="garden-iron" class="skill-button iron-button" type="button" aria-label="铁山靠" aria-busy="false" hidden disabled>
          <span class="skill-thumb"><svg viewBox="0 0 32 28" aria-hidden="true"><path d="M16 4 7 15h7l-1 9 12-13h-8l3-7z" fill="currentColor"/><path d="M4 8h7m-8 4h4m15 8h6m-5 4h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><strong id="iron-title">铁山靠</strong></span>
        </button>
        <button id="garden-basketball" class="skill-button basketball-button" type="button" aria-label="篮球" aria-keyshortcuts="B" title="篮球 (B)" aria-busy="false" hidden disabled>
          <span class="skill-thumb"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8M5.6 18.4 18.4 5.6M3 11.6c4.7-1 8.4 2.7 9.4 9.4M11.6 3c-1 4.7 2.7 8.4 9.4 9.4"/></svg><strong id="basketball-title">篮球</strong></span>
        </button>
        <button id="garden-jump" class="skill-button jump-button" type="button" aria-label="跳" aria-keyshortcuts="J" title="跳 (J)" aria-busy="false" hidden disabled>
          <span class="skill-thumb"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4m-4 4 4-4 4 4M3 11c1 5 4 7 9 7s8-2 9-7c-3 1-5 2-7 4m-4 0c-2-2-4-3-7-4m6 10h6"/></svg><strong id="jump-title">跳</strong></span>
        </button>
        <button id="garden-rap" class="skill-button rap-button" type="button" aria-label="RAP" aria-keyshortcuts="R" title="RAP (R)" aria-busy="false" hidden disabled>
          <span class="skill-thumb"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8.5h19m-17 0 1.1 5a2 2 0 0 0 2 1.6h1.5a2 2 0 0 0 1.9-1.5l1-3 1 3a2 2 0 0 0 1.9 1.5h1.5a2 2 0 0 0 2-1.6l1.1-5M7 11l1 1m8-1 1 1"/></svg><strong id="rap-title">RAP</strong></span>
        </button>
      </div>
      <button id="garden-gait" class="gait-switch" role="switch" aria-label="小跑模式" aria-checked="true" title="切换为轻快走"><span class="gait-track" aria-hidden="true"><span><svg viewBox="0 0 24 24"><use href="#ui-walk"/></svg></span><span><svg viewBox="0 0 24 24"><use href="#ui-run"/></svg></span></span></button>
    </div>
    <section id="garden-controls" class="garden-controls" aria-label="庭院对话">
      <div id="garden-party" class="garden-party" role="group" aria-label="操控角色">
        <div id="garden-reserves" class="garden-reserves" hidden></div>
      </div>
      <div class="garden-dialog">
        <h2 id="garden-speaker" class="garden-speaker">ZUZU</h2>
        <p id="garden-feedback" class="garden-feedback" role="status" aria-live="polite">准备好啦，选一块草地吧。</p>
      </div>
    </section>
  </div>
  <div class="status" role="status"><span class="dot"></span><span id="status">正在加载游戏资源…</span></div>
  <div id="error" role="alert" hidden></div>
</main>
<p id="garden-zoom-notice" class="garden-zoom-notice" role="status" hidden>双指捏合，恢复网页原比例</p>
<script type="module" src="/src/main.js"></script>
</body></html>
